<form id="checkout" action="/api/orders" method="post">
  <label for="name">Name</label>
  <input id="name" name="name" autocomplete="name" required>

  <label for="email">E-Mail</label>
  <input id="email" name="email" type="email" autocomplete="email" required>

  <label for="postalCode">PLZ</label>
  <input id="postalCode" name="postalCode" inputmode="numeric" autocomplete="postal-code"
    pattern="\d{5}" title="Fünf Ziffern, zum Beispiel 04109" required>

  <label for="quantity">Menge</label>
  <input id="quantity" name="quantity" type="number" min="1" step="1" value="1" required>

  <button type="submit">Bestellen</button>
</form>
